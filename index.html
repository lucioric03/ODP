      {/* Calculateur */}
      <SectionTitle>Outils</SectionTitle>
      <OneRMCalc onApply={(id, v) => setRM(id, v)} />

      {/* Réglages */}
      <SectionTitle sub="Alertes de fin de temps de repos.">Alertes</SectionTitle>
      <div className="space-y-2">
        <Toggle
          label="Son « YEAH BUDDY ! »"
          desc="Extrait de Ronnie Coleman à la fin du repos"
          val={state.settings.sound}
          onChange={(v) => { if (v) AudioFX.unlock(); setState((s) => ({ ...s, settings: { ...s.settings, sound: v } })); }}
        />
        <Toggle
          label="Vibration"
          desc="Web Vibration API — Android/Chrome uniquement"
          val={state.settings.vibration}
          onChange={(v) => { if (v) vibrate(60); setState((s) => ({ ...s, settings: { ...s.settings, vibration: v } })); }}
        />
        <Toggle
          label="Alerte en arrière-plan"
          desc="Sonne écran verrouillé ou appli fermée · se mélange à Spotify sans le couper"
          val={state.settings.bgAlarm !== false}
          onChange={(v) => { if (v) AudioFX.unlock(); setState((s) => ({ ...s, settings: { ...s.settings, bgAlarm: v } })); }}
        />
        <Toggle
          label="Chrono automatique"
          desc="Démarre le repos dès qu'une série est validée"
          val={state.settings.autoTimer}
          onChange={(v) => setState((s) => ({ ...s, settings: { ...s.settings, autoTimer: v } }))}
        />
        <button
          onClick={() => { AudioFX.unlock(); vibrate([200, 100, 200, 100, 500]); AudioFX.yeahBuddy(); }}
          className="press w-full rounded-2xl border border-neon/40 bg-neon/[.1] py-3.5 font-display text-xs uppercase tracking-wider text-neon"
        >
          🔊 Tester l'alerte
        </button>
        <button
          onClick={() => { AudioFX.unlock(); BgAlarm.arm(8); }}
          className="press w-full rounded-2xl border border-cyan2/40 bg-cyan2/[.1] py-3.5 font-display text-xs uppercase tracking-wider text-cyan2"
        >
          🔔 Tester en arrière-plan — 8 s
        </button>
        <p className="px-1 text-[10px] font-semibold leading-relaxed text-white/35">
          Lance le test puis verrouille l'écran ou passe sur une autre appli : l'alarme doit
          retentir 8 s plus tard. Sur iPhone, garde le bouton latéral silencieux désactivé.
        </p>
      </div>

      {/* Son personnalisé */}
      <Card accent="pink" className="rise p-4">
        <p className="font-display text-sm uppercase text-white">🎙️ Son de fin de repos</p>
        <p className="mt-0.5 text-[11px] font-semibold leading-relaxed text-white/45">
          L'extrait « YEAH BUDDY » (4 s) est intégré à l'application et joue par défaut. Tu peux le remplacer
          par ton propre fichier — stocké en local, jamais envoyé nulle part. Garde-le court : moins de 1 Mo.
        </p>

        {!sound && (
          <div className="mt-3 flex items-center gap-2 rounded-2xl border border-neon/35 bg-neon/[.07] p-3">
            <span className="text-xl">🐐</span>
            <div className="min-w-0 flex-1">
              <p className="truncate text-[12px] font-extrabold text-white/85">Ronnie Coleman — YEAH BUDDY</p>
              <p className="text-[10px] font-bold text-white/40">Son par défaut · 4 s</p>
            </div>
            <button
              onClick={() => { AudioFX.unlock(); AudioFX.playCustom(); }}
              className="press shrink-0 rounded-xl border border-white/15 bg-white/[.06] px-3 py-2 text-[10px] font-black text-white/70"
            >▶ Écouter</button>
          </div>
        )}

        {sound ? (
          <div className="mt-3 flex items-center gap-2 rounded-2xl border border-lime2/35 bg-lime2/[.07] p-3">
            <span className="text-xl">🎵</span>
            <div className="min-w-0 flex-1">
              <p className="truncate text-[12px] font-extrabold text-white/85">{sound.name}</p>
              <p className="text-[10px] font-bold text-white/40">{Math.round(sound.size / 1024)} Ko</p>
            </div>
            <button
              onClick={() => { AudioFX.unlock(); AudioFX.playCustom(); }}
              className="press shrink-0 rounded-xl border border-white/15 bg-white/[.06] px-3 py-2 text-[10px] font-black text-white/70"
            >▶ Écouter</button>
            <button
              onClick={() => { CustomSound.clear(); setSound(null); }}
              className="press shrink-0 rounded-xl border border-neon/40 bg-neon/[.1] px-3 py-2 text-[10px] font-black text-neon"
            >✕</button>
          </div>
        ) : (
          <div className="mt-2">
            <GhostButton accent="pink" className="w-full" onClick={() => soundRef.current && soundRef.current.click()}>
              ⬆ Remplacer par mon fichier
            </GhostButton>
          </div>
        )}

        <input
          ref={soundRef}
          type="file"
          accept="audio/*"
          className="hidden"
          onChange={(e) => {
            const f = e.target.files && e.target.files[0];
            e.target.value = '';
            if (!f) return;
            if (f.size > 1500000) {
              alert('Fichier trop lourd (' + Math.round(f.size / 1024) + ' Ko).\nLe stockage local est limité : reste sous 1 Mo, soit 2-3 secondes en MP3.');
              return;
            }
            const reader = new FileReader();
            reader.onload = () => {
              const entry = { name: f.name, size: f.size, data: String(reader.result) };
              if (!CustomSound.set(entry)) {
                alert('Stockage saturé. Essaie un fichier plus court ou vide ton historique.');
                return;
              }
              setSound(entry);
              AudioFX.unlock();
              AudioFX.playCustom();
            };
            reader.onerror = () => alert('Lecture du fichier impossible.');
            reader.readAsDataURL(f);
          }}
        />
      </Card>

      {/* Historique */}
      {sessions.length > 0 && (
        <>
          <SectionTitle sub={`${sessions.length} séance${sessions.length > 1 ? 's' : ''} enregistrée${sessions.length > 1 ? 's' : ''}.`}>
            Historique
          </SectionTitle>
          <Card accent="lime" className="rise divide-y divide-white/[.07] p-1">
            {sessions.slice(0, 12).map((k) => {
              const d = new Date(k + 'T12:00:00');
              const p = PROGRAM[d.getDay()];
              const n = Object.values(state.logs[k]).filter(Boolean).length;
              return (
                <div key={k} className="flex items-center gap-3 px-3 py-2.5">
                  <div className="h-8 w-1 shrink-0 rounded-full grad-lime" />
                  <div className="min-w-0 flex-1">
                    <p className="truncate text-[12px] font-extrabold text-white/80">{p.off ? 'Séance libre' : p.title}</p>
                    <p className="text-[10px] font-bold text-white/35">{d.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' })}</p>
                  </div>
                  <span className="shrink-0 font-display text-sm text-lime2">{n}<span className="text-[9px] text-white/30"> séries</span></span>
                </div>
              );
            })}
          </Card>
        </>
      )}

      {/* Données */}
      <SectionTitle sub="Tout est stocké en local dans ton navigateur. Rien ne quitte ton téléphone.">
        Mes Données
      </SectionTitle>
      <div className="grid grid-cols-2 gap-2">
        <GhostButton accent="cyan" onClick={exportData}>⬇ Exporter</GhostButton>
        <GhostButton accent="viol" onClick={() => fileRef.current && fileRef.current.click()}>⬆ Importer</GhostButton>
      </div>
      <input ref={fileRef} type="file" accept="application/json,.json" onChange={importData} className="hidden" />
      <div className="grid grid-cols-2 gap-2">
        <GhostButton accent="viol" onClick={clearHistory}>🗑 Vider l'historique</GhostButton>
        <button
          onClick={resetAll}
          className="press rounded-2xl border border-neon/40 bg-neon/[.1] px-4 py-3 text-xs font-black uppercase tracking-wider text-neon"
        >
          ⚠️ Tout réinitialiser
        </button>
      </div>

      <p className="px-2 pb-2 pt-3 text-center text-[10px] font-semibold leading-relaxed text-white/25">
        ODP — Programme hybride Force & Hypertrophie.<br />
        Données 100 % locales (LocalStorage). Aucun compte, aucun serveur.
      </p>
    </div>
  );
}

/* ============================================================
   11 bis. CALCUL MÉTABOLIQUE (Mifflin-St Jeor 1990)
   ============================================================ */

const ACTIVITY = [
  { f: 1.2,   label: 'Sédentaire',        desc: 'Peu ou pas d\'exercice' },
  { f: 1.375, label: 'Légèrement actif',  desc: 'Exercice léger 1-3 j/semaine' },
  { f: 1.55,  label: 'Modérément actif',  desc: 'Exercice modéré 3-5 j/semaine' },
  { f: 1.725, label: 'Très actif',        desc: 'Exercice intense 6-7 j/semaine' },
  { f: 1.9,   label: 'Extrêmement actif', desc: 'Exercice très intense + travail physique' },
];

const GOALS = [
  { id: 'seche',    label: 'Sèche',          accent: 'cyan', mult: 0.85, range: [0.80, 0.85], tag: '−15 %', note: 'Déficit modéré (−15 à −20 %)' },
  { id: 'maintien', label: 'Maintien',       accent: 'viol', mult: 1.00, range: [1.00, 1.00], tag: '=',     note: 'Aucun ajustement' },
  { id: 'masse',    label: 'Prise de masse', accent: 'pink', mult: 1.10, range: [1.10, 1.15], tag: '+10 %', note: 'Surplus modéré (+10 à +15 %)' },
];

// Défini hors du composant : une définition interne serait recréée à chaque
// rendu, React démonterait l'input et le champ perdrait le focus à chaque frappe.
function NumField({ label, value, unit, placeholder, step, onChange }) {
  return (
    <div>
      <label className="mb-1 block text-[10px] font-black uppercase tracking-wider text-white/40">{label}</label>
      <div className="relative">
        <input
          type="number" inputMode="decimal" step={step || '1'}
          value={value || ''}
          onChange={(e) => onChange(Math.max(0, parseFloat(e.target.value) || 0))}
          placeholder={placeholder}
          className="w-full rounded-xl border border-white/12 bg-white/[.05] px-3 py-3 pr-9 text-center font-display text-xl text-white outline-none focus:border-lime2/60"
        />
        <span className="pointer-events-none absolute right-2.5 top-1/2 -translate-y-1/2 text-[10px] font-black text-white/30">{unit}</span>
      </div>
    </div>
  );
}

function NutritionView({ state, setState }) {
  const n = state.nutrition;
  const set = (k, v) => setState((s) => ({ ...s, nutrition: { ...s.nutrition, [k]: v } }));

  const w = Number(n.weight) || 0;
  const h = Number(n.height) || 0;
  const age = Number(n.age) || 0;
  const complete = w > 0 && h > 0 && age > 0;

  // Mifflin-St Jeor (1990)
  const bmr = complete
    ? Math.round(10 * w + 6.25 * h - 5 * age + (n.sex === 'h' ? 5 : -161))
    : 0;
  const tdee = bmr ? Math.round(bmr * n.activity) : 0;
  const goal = GOALS.find((g) => g.id === n.goal) || GOALS[1];
  const kcal = tdee ? Math.round(tdee * goal.mult) : 0;
  const lo = tdee ? Math.round(tdee * Math.min(goal.range[0], goal.range[1])) : 0;
  const hi = tdee ? Math.round(tdee * Math.max(goal.range[0], goal.range[1])) : 0;

  // Macros — protéines prioritaires quel que soit l'objectif
  const protG = w ? Math.round(w * 2.0) : 0;
  const protMin = w ? Math.round(w * 1.8) : 0;
  const protMax = w ? Math.round(w * 2.2) : 0;
  const protKcal = protG * 4;
  const fatKcal = kcal ? Math.round(kcal * 0.25) : 0;
  const fatG = Math.round(fatKcal / 9);
  const carbKcal = Math.max(0, kcal - protKcal - fatKcal);
  const carbG = Math.round(carbKcal / 4);
  const macroImpossible = kcal > 0 && protKcal + fatKcal > kcal;

  return (
    <div className="space-y-4">
      <SectionTitle sub="Estimation de tes besoins caloriques quotidiens.">
        Calcul Métabolique
      </SectionTitle>

      {/* 1 — Données personnelles */}
      <Card accent="lime" glow={complete} className="rise p-4">
        <p className="mb-3 font-display text-sm uppercase text-white">1 · Tes données</p>

        <div className="mb-3 grid grid-cols-3 gap-2">
          <NumField label="Poids"  value={n.weight} unit="KG"  placeholder="80"  step="0.1" onChange={(v) => set('weight', v)} />
          <NumField label="Taille" value={n.height} unit="CM"  placeholder="178"            onChange={(v) => set('height', v)} />
          <NumField label="Âge"    value={n.age}    unit="ANS" placeholder="25"             onChange={(v) => set('age', v)} />
        </div>

        <label className="mb-1 block text-[10px] font-black uppercase tracking-wider text-white/40">Sexe</label>
        <div className="flex gap-2">
          {[['h', 'Homme'], ['f', 'Femme']].map(([v, lbl]) => (
            <button
              key={v}
              onClick={() => set('sex', v)}
              className={`press flex-1 rounded-xl border py-3 font-display text-xs uppercase tracking-wider transition-all ${
                n.sex === v ? 'grad-lime border-transparent text-ink' : 'border-white/12 bg-white/[.04] text-white/50'
              }`}
            >{lbl}</button>
          ))}
        </div>

        {complete && (
          <div className="mt-3 rounded-2xl border border-white/10 bg-white/[.04] p-3 text-center">
            <p className="text-[10px] font-black uppercase tracking-wider text-white/40">Métabolisme de base (BMR)</p>
            <p className="font-display text-2xl text-white/90">{bmr.toLocaleString('fr-FR')} <span className="text-xs text-white/40">KCAL/JOUR</span></p>
          </div>
        )}
      </Card>

      {/* 2 — Niveau d'activité */}
      <Card accent="cyan" className="rise p-4">
        <p className="mb-3 font-display text-sm uppercase text-white">2 · Niveau d'activité</p>
        <div className="space-y-1.5">
          {ACTIVITY.map((act) => {
            const active = Math.abs(n.activity - act.f) < 0.001;
            return (
              <button
                key={act.f}
                onClick={() => set('activity', act.f)}
                className={`press flex w-full items-center gap-3 rounded-2xl border p-3 text-left transition-all ${
                  active ? 'border-cyan2/50 bg-cyan2/[.09]' : 'border-white/10 bg-white/[.03]'
                }`}
              >
                <div className="min-w-0 flex-1">
                  <p className={`text-[13px] font-extrabold ${active ? 'text-cyan2' : 'text-white/75'}`}>{act.label}</p>
                  <p className="text-[10px] font-semibold text-white/35">{act.desc}</p>
                </div>
                <span className={`shrink-0 font-display text-sm ${active ? 'text-cyan2' : 'text-white/30'}`}>×{act.f}</span>
              </button>
            );
          })}
        </div>

        {complete && (
          <div className="mt-3 rounded-2xl border border-cyan2/30 bg-cyan2/[.07] p-3 text-center">
            <p className="text-[10px] font-black uppercase tracking-wider text-white/40">TDEE — dépense totale</p>
            <p className="font-display text-2xl text-cyan2">{tdee.toLocaleString('fr-FR')} <span className="text-xs text-white/40">KCAL/JOUR</span></p>
            <p className="mt-0.5 text-[10px] font-bold text-white/35">{bmr.toLocaleString('fr-FR')} × {n.activity}</p>
          </div>
        )}
      </Card>

      {/* 3 — Objectif */}
      <Card accent="viol" className="rise p-4">
        <p className="mb-3 font-display text-sm uppercase text-white">3 · Ton objectif</p>
        <div className="grid grid-cols-3 gap-2">
          {GOALS.map((g) => {
            const active = n.goal === g.id;
            const acc = ACC[g.accent];
            return (
              <button
                key={g.id}
                onClick={() => set('goal', g.id)}
                className={`press rounded-2xl border p-3 text-center transition-all ${
                  active ? 'border-white/25 bg-white/[.09]' : 'border-white/[.08] bg-white/[.025]'
                }`}
                style={active ? { boxShadow: `0 0 0 1px ${acc.hex}55, 0 0 24px -8px ${acc.hex}` } : undefined}
              >
                <p className={`font-display text-[11px] uppercase leading-tight ${active ? acc.text : 'text-white/40'}`}>{g.label}</p>
                <p className={`mt-1 font-display text-sm ${active ? acc.text : 'text-white/25'}`}>{g.tag}</p>
              </button>
            );
          })}
        </div>
        <p className="mt-2 text-center text-[10px] font-semibold text-white/35">{goal.note}</p>
      </Card>

      {/* 4 — Résultat */}
      {complete ? (
        <Card accent="lime" glow className="rise p-5 text-center">
          <p className="text-[10px] font-black uppercase tracking-[.2em] text-white/40">Calories recommandées</p>
          <p className="font-display text-6xl leading-none clip-text grad-lime">{kcal.toLocaleString('fr-FR')}</p>
          <p className="mt-1 font-display text-sm text-white/50">KCAL / JOUR</p>

          {goal.id !== 'maintien' && (
            <p className="mt-2 text-[11px] font-bold text-white/40">
              Fourchette conseillée : <b className="text-white/70">{Math.min(lo, hi).toLocaleString('fr-FR')} – {Math.max(lo, hi).toLocaleString('fr-FR')}</b> kcal
            </p>
          )}

          <p className="mt-4 border-t border-white/10 pt-3 text-[10px] font-semibold leading-relaxed text-white/35">
            Calcul basé sur la formule de Mifflin-St Jeor (1990), reconnue comme la référence la plus précise
            pour l'estimation du métabolisme de base.
          </p>
        </Card>
      ) : (
        <Card accent="viol" className="rise p-6 text-center">
          <div className="text-4xl">📊</div>
          <p className="mt-2 font-display text-base text-white/70">Renseigne poids, taille et âge</p>
          <p className="mt-1 text-[11px] font-semibold text-white/40">Le calcul se met à jour automatiquement.</p>
        </Card>
      )}

      {/* Macros */}
      {complete && kcal > 0 && (
        <>
          <SectionTitle sub={`Protéines prioritaires : ${protMin}-${protMax} g/jour (1,8-2,2 g/kg), quel que soit l'objectif.`}>
            Répartition des macros
          </SectionTitle>

          {macroImpossible ? (
            <Card accent="pink" className="rise p-4">
              <p className="text-[11px] font-bold leading-relaxed text-neon">
                ⚠️ À {kcal.toLocaleString('fr-FR')} kcal, les protéines ({protG} g) et les lipides ({fatG} g) dépassent déjà
                le total. Ce déficit est trop agressif pour ton poids de corps — remonte les calories ou change d'objectif.
              </p>
            </Card>
          ) : (
            <>
              <div className="grid grid-cols-3 gap-2">
                {[
                  { label: 'Protéines', g: protG, kcal: protKcal, accent: 'pink', icon: '🥩' },
                  { label: 'Glucides',  g: carbG, kcal: carbKcal, accent: 'cyan', icon: '🍚' },
                  { label: 'Lipides',   g: fatG,  kcal: fatKcal,  accent: 'viol', icon: '🥑' },
                ].map((m) => {
                  const acc = ACC[m.accent];
                  const pct = Math.round((m.kcal / kcal) * 100);
                  return (
                    <Card key={m.label} accent={m.accent} glow className="p-3 text-center">
                      <div className="text-xl">{m.icon}</div>
                      <p className={`mt-1 font-display text-2xl leading-none ${acc.text}`}>{m.g}</p>
                      <p className="text-[9px] font-black uppercase tracking-wider text-white/35">grammes</p>
                      <p className="mt-1.5 text-[10px] font-black uppercase tracking-wide text-white/55">{m.label}</p>
                      <p className="text-[9px] font-bold text-white/30">{m.kcal.toLocaleString('fr-FR')} kcal · {pct} %</p>
                    </Card>
                  );
                })}
              </div>

              <Card accent="lime" className="rise p-4">
                <p className="text-[11px] font-semibold leading-relaxed text-white/50">
                  <b className="text-lime2">Méthode :</b> protéines fixées à 2 g/kg de poids de corps pour préserver la masse
                  musculaire, lipides à 25 % des calories pour l'équilibre hormonal, glucides sur le reste — ce sont eux
                  qui alimentent tes séries lourdes de SBD.
                </p>
              </Card>
            </>
          )}

          <Card accent="viol" className="rise p-4">
            <p className="text-[11px] font-semibold leading-relaxed text-white/45">
              💡 Ces valeurs sont une <b className="text-white/70">estimation de départ</b>, pas une vérité absolue.
              Pèse-toi 3 fois par semaine à jeun et ajuste de 100 à 200 kcal après 2 semaines si le poids ne bouge pas
              dans le sens voulu. En cas de pathologie ou de régime encadré, demande l'avis d'un professionnel de santé.
            </p>
          </Card>
        </>
      )}
    </div>
  );
}

/* ============================================================

];

        </h1>

/* ============================================================
   13. APP
   ============================================================ */

function App() {
  const [state, setState] = useState(loadState);
  const [tab, setTab] = useState('today');
  const [timer, setTimer] = useState(null);
  const [prDialog, setPrDialog] = useState(null);      // { liftId, prefill }
  const [celebration, setCelebration] = useState(null);
  const timerIdRef = useRef(0);
  const settingsRef = useRef(state.settings);

  // Persistance automatique
  useEffect(() => { saveState(state); }, [state]);
  useEffect(() => { settingsRef.current = state.settings; }, [state.settings]);

  // Déblocage audio au premier geste utilisateur (iOS/Safari)
  useEffect(() => {
    const unlock = () => { AudioFX.unlock(); window.removeEventListener('pointerdown', unlock); };
    window.addEventListener('pointerdown', unlock, { once: true });
    if ('speechSynthesis' in window) window.speechSynthesis.getVoices();
    return () => window.removeEventListener('pointerdown', unlock);
  }, []);

  const toggleSet = useCallback((dayKey, key, checked) => {
    setState((s) => {
      const day = { ...(s.logs[dayKey] || {}) };
      if (checked) day[key] = true; else delete day[key];
      const next = { ...s, logs: { ...s.logs, [dayKey]: day } };
      // Filet de sécurité : valider une série sans avoir appuyé sur DÉMARRER
      // lance quand même le chrono, sinon la durée serait perdue.
      const sess = (s.sessions || {})[dayKey];
      if (checked && (!sess || !sess.start)) {
        next.sessions = { ...(s.sessions || {}), [dayKey]: { start: Date.now(), end: null } };
      }
      return next;
    });
  }, []);

  /* ---------- Chrono de séance : start / stop / resume / reset ---------- */
  const setSession = useCallback((dayKey, action) => {
    setState((s) => {
      const all = { ...(s.sessions || {}) };
      const cur = all[dayKey];
      if (action === 'start') all[dayKey] = { start: Date.now(), end: null };
      else if (action === 'stop') {
        if (!cur || !cur.start || cur.end) return s;
        all[dayKey] = { ...cur, end: Date.now() };
      } else if (action === 'resume') {
        if (!cur || !cur.end) return s;
        all[dayKey] = { ...cur, end: null };
      } else if (action === 'reset') {
        if (!cur) return s;
        delete all[dayKey];
      } else return s;

      const keys = Object.keys(all).sort();
      if (keys.length > 90) keys.slice(0, keys.length - 90).forEach((k) => delete all[k]);
      return { ...s, sessions: all };
    });
  }, []);

  /* ---------- Records ----------
     Une perf qui dépasse le 1RM courant met le profil à jour immédiatement :
     tous les pourcentages du programme se recalculent dans la foulée. */
  const submitPR = useCallback((liftId, weight, reps, force) => {
    setState((s) => {
      // Verrou métier : seule une répétition unique fait autorité sur le 1RM.
      if (reps !== 1) return s;
      const est = round2_5(weight);
      const prev = Number(s.profile[liftId]) || 0;
      const isPR = est > prev + 0.01;
      if (!isPR && !force) return s;

      if (isPR) {
        setCelebration({ lift: liftId, est, prev, delta: est - prev, weight, reps });
        if (s.settings.vibration) vibrate([80, 60, 80, 60, 320]);
        if (s.settings.sound) AudioFX.prFanfare();
      }

      const entry = {
        id: Date.now(),
        lift: liftId,
        weight, reps,
        e1rm: est,
        prev,
        date: dateKey(),
        kind: isPR ? 'pr' : 'correction',
      };
      return {
        ...s,
        profile: { ...s.profile, [liftId]: est },
        prs: [entry, ...(s.prs || [])].slice(0, 200),
      };
    });
    setPrDialog(null);
  }, []);

  // Fin de mésocycle : applique la progression conseillée aux 4 mouvements
  const applyCycleBump = useCallback(() => {
    setState((s) => {
      const profile = { ...s.profile };
      const entries = [];
      LIFTS.forEach((l) => {
        const prev = Number(profile[l.id]) || 0;
        if (!prev) return;
        const next = round2_5(prev + CYCLE_BUMP[l.id]);
        profile[l.id] = next;
        entries.push({
          id: Date.now() + Math.random(), lift: l.id, weight: next, reps: 1,
          e1rm: next, prev, date: dateKey(), kind: 'cycle',
        });
      });
      return {
        ...s,
        profile,
        week: 1,
        cycleNo: (s.cycleNo || 1) + 1,
        prs: [...entries, ...(s.prs || [])].slice(0, 200),
      };
    });
  }, []);

  // Charge & reps réalisées sur une série d'hypertrophie
  const setPerf = useCallback((dayKey, exName, setIdx, field, value) => {
    setState((s) => {
      const log = { ...(s.perfLog || {}) };
      const day = { ...(log[dayKey] || {}) };
      const sets = (day[exName] || []).slice();
      while (sets.length <= setIdx) sets.push({ w: null, r: null });
      const clean = typeof value === 'number' && isFinite(value) ? value : null;
      sets[setIdx] = { ...normPerf(sets[setIdx]), [field]: clean };
      day[exName] = sets;
      log[dayKey] = day;

      // Borne l'historique aux 90 dernières dates : inutile de tout garder
      const keys = Object.keys(log).sort();
      if (keys.length > 90) keys.slice(0, keys.length - 90).forEach((k) => delete log[k]);

      return { ...s, perfLog: log };
    });
  }, []);

  // Séance réorganisée par l'utilisateur (null = retour au programme d'origine)
  const setDayPlan = useCallback((dow, names) => {
    setState((s) => {
      const next = { ...(s.dayPlans || {}) };
      if (names == null) delete next[dow];
      else next[dow] = names;
      return { ...s, dayPlans: next };
    });
  }, []);

  // Temps de repos personnalisé, mémorisé par nom d'exercice (null = retour au défaut)
  const setRestOverride = useCallback((name, seconds) => {
    setState((s) => {
      const next = { ...(s.restOverrides || {}) };
      if (seconds == null) delete next[name];
      else next[name] = seconds;
      return { ...s, restOverrides: next };
    });
  }, []);

  const startTimer = useCallback((seconds, label, accent) => {
    if (!settingsRef.current.autoTimer) return;
    // Armé ici, dans le geste qui valide la série : l'alerte de fin est
    // confiée au système et sonnera même appli fermée ou écran verrouillé.
    rearmAlarm(settingsRef.current, seconds);
    timerIdRef.current += 1;
    setTimer({
      id: timerIdRef.current,
      total: seconds,
      endsAt: Date.now() + seconds * 1000,
      label,
      accent,
      paused: false,
      remaining: seconds,
    });
  }, []);

  return (
    <div className="mx-auto min-h-screen max-w-3xl px-4 pb-40" style={{ paddingTop: 'calc(18px + var(--safe-t))' }}>
      <Header state={state} />

      {tab === 'today' && (
        <TodayView
          state={state}
          setState={setState}
          toggleSet={toggleSet}
          setSession={setSession}
          startTimer={startTimer}
          openPR={(liftId, prefill) => setPrDialog({ liftId, prefill })}
          setRestOverride={setRestOverride}
          setDayPlan={setDayPlan}
          setPerf={setPerf}
          goProfile={() => { setTab('profile'); window.scrollTo({ top: 0, behavior: 'smooth' }); }}
        />
      )}
      {tab === 'program' && <ProgramView state={state} />}
      {tab === 'nutrition' && <NutritionView state={state} setState={setState} />}
      {tab === 'profile' && (
        <ProfileView
          state={state}
          setState={setState}
          openPR={(liftId, prefill) => setPrDialog({ liftId, prefill })}
          applyCycleBump={applyCycleBump}
        />
      )}

      {prDialog && (
        <PRDialog
          liftId={prDialog.liftId}
          prefill={prDialog.prefill}
          state={state}
          onSubmit={submitPR}
          onClose={() => setPrDialog(null)}
        />
      )}
      {celebration && <PRCelebration data={celebration} onClose={() => setCelebration(null)} />}

      <RestTimer timer={timer} setTimer={setTimer} settings={state.settings} />
      <TabBar tab={tab} setTab={setTab} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

/* ============================================================
   14. PWA — manifeste + icône générés à la volée (fichier unique)
   ============================================================ */
(function setupPWA() {
  try {
    const c = document.createElement('canvas');
    c.width = c.height = 512;
    const x = c.getContext('2d');
    const g = x.createLinearGradient(0, 0, 512, 512);
    g.addColorStop(0, '#FF007F'); g.addColorStop(0.5, '#8B5CF6'); g.addColorStop(1, '#00F0FF');
    x.fillStyle = '#0B1020'; x.fillRect(0, 0, 512, 512);
    x.fillStyle = g; x.fillRect(0, 150, 512, 212);
    x.fillStyle = '#0B1020';
    x.font = '900 150px Impact, sans-serif';
    x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillText('ODP', 256, 258);
    const icon = c.toDataURL('image/png');

    const manifest = {
      name: 'ODP — Force & Hypertrophie',
      short_name: 'ODP',
      start_url: '.',
      display: 'standalone',
      background_color: '#0B1020',
      theme_color: '#0B1020',
      orientation: 'portrait',
      icons: [
        { src: icon, sizes: '512x512', type: 'image/png', purpose: 'any' },
        { src: icon, sizes: '512x512', type: 'image/png', purpose: 'maskable' },
      ],
    };
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' }));
    document.head.appendChild(link);

    const apple = document.createElement('link');
    apple.rel = 'apple-touch-icon';
    apple.href = icon;
    document.head.appendChild(apple);
  } catch (e) { /* PWA non critique */ }
})();
</script>
