<title>ODP — Programme Force & Hypertrophie</title>

<meta name="mobile-web-app-capable" content="yes" />

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          neon:  '#FF007F',
          cyan2: '#00F0FF',
          lime2: '#39FF14',
          viol:  '#8B5CF6',
          ink:   '#0B1020',
        },
        fontFamily: {
          display: ['"Archivo Black"', 'Impact', 'system-ui', 'sans-serif'],
          body: ['Inter', 'system-ui', '-apple-system', 'Segoe UI', 'sans-serif'],
        },
      },
    },
  };
</script>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<style>
  :root { --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px); }

  html, body { height: 100%; }
  body {
    background-color: #070A16;
    background-image:
      radial-gradient(1100px 700px at 12% -8%,  rgba(139,92,246,.30), transparent 60%),
      radial-gradient(950px  650px at 92% 4%,   rgba(255,0,127,.22),  transparent 62%),
      radial-gradient(1000px 800px at 50% 108%, rgba(0,240,255,.16),  transparent 60%),
      linear-gradient(180deg, #0B1020 0%, #0A0E1E 45%, #070A16 100%);
    background-attachment: fixed;
    color: #E8ECFF;
    font-family: Inter, system-ui, -apple-system, sans-serif;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: none;
  }

  .font-display { font-family: 'Archivo Black', Impact, sans-serif; letter-spacing: -.02em; }

  /* ---------- Glassmorphism ---------- */
  .glass {
    background: linear-gradient(150deg, rgba(255,255,255,.085), rgba(255,255,255,.025) 45%, rgba(255,255,255,.05));
    backdrop-filter: blur(18px) saturate(155%);
    -webkit-backdrop-filter: blur(18px) saturate(155%);
    border: 1px solid rgba(255,255,255,.13);
    box-shadow: 0 10px 34px -12px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.14);
  }
  .glass-strong {
    background: linear-gradient(150deg, rgba(20,26,52,.94), rgba(12,16,36,.90));
    backdrop-filter: blur(26px) saturate(170%);
    -webkit-backdrop-filter: blur(26px) saturate(170%);
    border: 1px solid rgba(255,255,255,.15);
  }

  /* ---------- Neon edges ---------- */
  .edge-pink  { box-shadow: 0 0 0 1px rgba(255,0,127,.42),  0 0 26px -6px rgba(255,0,127,.60),  inset 0 1px 0 rgba(255,255,255,.14); }
  .edge-cyan  { box-shadow: 0 0 0 1px rgba(0,240,255,.42),  0 0 26px -6px rgba(0,240,255,.55),  inset 0 1px 0 rgba(255,255,255,.14); }
  .edge-lime  { box-shadow: 0 0 0 1px rgba(57,255,20,.40),  0 0 26px -6px rgba(57,255,20,.50),  inset 0 1px 0 rgba(255,255,255,.14); }
  .edge-viol  { box-shadow: 0 0 0 1px rgba(139,92,246,.48), 0 0 26px -6px rgba(139,92,246,.60), inset 0 1px 0 rgba(255,255,255,.14); }

  .text-glow-pink { text-shadow: 0 0 18px rgba(255,0,127,.65); }
  .text-glow-cyan { text-shadow: 0 0 18px rgba(0,240,255,.60); }
  .text-glow-lime { text-shadow: 0 0 18px rgba(57,255,20,.55); }
  .text-glow-viol { text-shadow: 0 0 18px rgba(139,92,246,.65); }

  .grad-pink { background-image: linear-gradient(120deg, #FF007F, #FF5FA2); }
  .grad-cyan { background-image: linear-gradient(120deg, #00F0FF, #47B6FF); }
  .grad-lime { background-image: linear-gradient(120deg, #39FF14, #A6FF57); }
  .grad-viol { background-image: linear-gradient(120deg, #8B5CF6, #C084FC); }

  .clip-text { -webkit-background-clip: text; background-clip: text; color: transparent; }

  /* ---------- Interactions ---------- */
  .press { transition: transform .12s cubic-bezier(.2,.8,.3,1), box-shadow .2s, filter .2s; }
  .press:active { transform: scale(.965); }

  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type="number"] { -moz-appearance: textfield; }

  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

  /* ---------- Animations ---------- */
  @keyframes riseIn { from { opacity:0; transform: translateY(14px); } to { opacity:1; transform:none; } }
  .rise { animation: riseIn .42s cubic-bezier(.2,.8,.3,1) both; }

  @keyframes popIn { 0% { transform: scale(.82); opacity:0 } 60% { transform: scale(1.04) } 100% { transform: scale(1); opacity:1 } }
  .pop { animation: popIn .3s cubic-bezier(.2,.9,.3,1.2) both; }

  @keyframes pulseGlow {
    0%,100% { box-shadow: 0 0 0 1px rgba(57,255,20,.5), 0 0 34px -6px rgba(57,255,20,.55); }
    50%     { box-shadow: 0 0 0 1px rgba(57,255,20,.9), 0 0 60px -2px rgba(57,255,20,.95); }
  }
  .alarm { animation: pulseGlow .55s ease-in-out infinite; }

  @keyframes shimmer { 0% { background-position: -180% 0 } 100% { background-position: 180% 0 } }
  .shimmer {
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.30), transparent);
    background-size: 180% 100%;
    animation: shimmer 2.2s linear infinite;
  }

  @keyframes slideUp { from { transform: translateY(120%); opacity:0 } to { transform: translateY(0); opacity:1 } }
  .slide-up { animation: slideUp .35s cubic-bezier(.2,.9,.3,1) both; }

  /* Célébration de record */
  @keyframes confettiFall {
    0%   { transform: translate3d(0,-12vh,0) rotate(0deg);    opacity: 1 }
    100% { transform: translate3d(0,104vh,0) rotate(760deg);  opacity: 0 }
  }
  .confetti {
    position: absolute; top: 0; width: 9px; height: 15px; border-radius: 2px;
    animation-name: confettiFall; animation-timing-function: linear; animation-fill-mode: forwards;
  }
  @keyframes prZoom {
    0%   { transform: scale(.55); opacity: 0 }
    55%  { transform: scale(1.07); opacity: 1 }
    100% { transform: scale(1);   opacity: 1 }
  }
  .pr-zoom { animation: prZoom .55s cubic-bezier(.2,.9,.3,1.35) both; }
  @keyframes trophySwing {
    0%,100% { transform: rotate(-9deg) }
    50%     { transform: rotate(9deg) }
  }
  .trophy { animation: trophySwing 1.1s ease-in-out infinite; display: inline-block; }

  .strike { text-decoration: line-through; text-decoration-color: rgba(57,255,20,.85); text-decoration-thickness: 2px; }

  /* Timer ring */
  .ring { transform: rotate(-90deg); transform-origin: 50% 50%; }
</style>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>

<script>
  // preset-react utilise par défaut le runtime "automatic", qui injecte un
  // `import ... from "react/jsx-runtime"` — illégal dans un script non-module.
  // On enregistre un preset équivalent en runtime classique (React.createElement).
  Babel.registerPreset('react-classic', {
    presets: [[Babel.availablePresets['react'], { runtime: 'classic' }]],
  });
</script>

/* ---------- Séance effective d'un jour : plan personnalisé s'il existe,
     sinon le programme d'origine. ---------- */
function exercisesFor(dow, state) {

  if (!p || p.off || !p.exercises) return [];
  const plan = state.dayPlans && state.dayPlans[dow];
  if (!plan || !plan.length) return p.exercises;
  const out = [];
  plan.forEach((name) => { const ex = CATALOG.get(name); if (ex) out.push(ex); });
  return out.length ? out : p.exercises;
}

     jour garde donc ses propres charges, et ce que tu saisis un jeudi ne
     déplace que le repère du jeudi suivant. ---------- */
function buildLastPerf(perfLog, beforeKey) {
  const out = {};
  const dow = dowOfKey(beforeKey);
  Object.keys(perfLog || {})
    .filter((d) => d < beforeKey && dowOfKey(d) === dow)

  return out;
}

/* ---------- Jour de la semaine d'une clé 'YYYY-MM-DD' (0 = dimanche).
     Midi local : aucun décalage d'heure d'été ne peut faire basculer le jour. ---------- */
function dowOfKey(key) {
  const parts = String(key || '').split('-');
  if (parts.length !== 3) return -1;
  const d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]), 12);
  return isNaN(d.getTime()) ? -1 : d.getDay();
}

/* ---------- Une perf stockée peut être partielle (charge sans reps, série
     jamais remplie…). On la ramène toujours à { w, r } avec des nombres ou
     null : plus aucun « undefined » ne peut remonter jusqu'à l'écran. ---------- */
function normPerf(s) {
  const n = (v) => (typeof v === 'number' && isFinite(v) ? v : v != null && v !== '' && isFinite(Number(v)) ? Number(v) : null);
  return { w: n(s && s.w), r: n(s && s.r) };
}

/* ---------- Charge à reprendre pour la série i : celle de la même série la
     dernière fois, sinon la série valide la plus proche de cette séance-là.
     Un exercice repris garde ainsi son poids même si tu changes de nombre
     de séries. ---------- */
function lastSetFor(lastPerf, i) {
  const sets = lastPerf && lastPerf.sets ? lastPerf.sets : null;
  if (!sets || !sets.length) return null;
  const at = (k) => {
    const s = sets[k] ? normPerf(sets[k]) : null;
    return s && (s.w != null || s.r != null) ? s : null;
  };
  const exact = at(i);
  if (exact) return exact;
  for (let d = 1; d < sets.length; d++) {
    const before = i - d >= 0 ? at(i - d) : null;
    if (before) return before;
    const after = i + d < sets.length ? at(i + d) : null;
    if (after) return after;
  }
  return null;
}

// Nom du partenaire de superset : l'exercice suivant du même groupe, s'il existe
function ssPartnerAt(list, i) {
  const ex = list[i], next = list[i + 1];
  return ex && ex.ss && next && next.ss === ex.ss ? next.name : null;
}

/* ============================================================
   2. HELPERS
   ============================================================ */

const round2_5 = (kg) => Math.round(kg / 2.5) * 2.5;
// 152.5 → "152.5" · 1.25 → "1.25" · 60 → "60"  (jamais d'arrondi trompeur)
const fmtKg = (kg) => String(parseFloat(Number(kg).toFixed(2)));
// Perf d'une série : « 40×10 », « 10 reps » ou « 40 kg » si l'un des deux manque.
const fmtPerf = (s) => {
  const n = normPerf(s);
  if (n.w != null && n.r != null) return `${fmtKg(n.w)}×${n.r}`;
  if (n.w != null) return `${fmtKg(n.w)} kg`;
  if (n.r != null) return `${n.r} reps`;
  return '—';
};
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function dateKey(d = new Date()) {
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

// Date réelle d'un jour de la semaine EN COURS (semaine commençant le lundi).
// Permet de cocher une séance consultée hors du jour J sans clé factice.
function dateOfWeekday(dow, ref = new Date()) {
  const cur = ref.getDay();
  const monday = new Date(ref);
  monday.setHours(12, 0, 0, 0);
  monday.setDate(ref.getDate() + (cur === 0 ? -6 : 1 - cur));
  const target = new Date(monday);
  target.setDate(monday.getDate() + (dow === 0 ? 6 : dow - 1));
  return target;
}

function prettyDate(d = new Date()) {
  return d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
}

// 90 → "1min 30s" · 180 → "3min" · 0 → "—"
function fmtRest(sec) {
  if (!sec) return '—';
  if (sec < 60) return `${sec}s`;
  const m = Math.floor(sec / 60), s = sec % 60;
  return s ? `${m}min ${s}s` : `${m}min`;
}

function mmss(sec) {
  const s = Math.max(0, Math.ceil(sec));
  return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
}

// Chrono de séance : 754 → "12:34" · 3725 → "1:02:05"
function hms(sec) {
  const s = Math.max(0, Math.floor(sec));
  const p = (n) => String(n).padStart(2, '0');
  const h = Math.floor(s / 3600);
  return h ? `${h}:${p(Math.floor((s % 3600) / 60))}:${p(s % 60)}` : `${p(Math.floor(s / 60))}:${p(s % 60)}`;
}

// Durée lisible : 45 → "45 s" · 754 → "13 min" · 3725 → "1 h 02"
function fmtDur(sec) {
  const s = Math.max(0, Math.round(sec));
  if (s < 60) return `${s} s`;
  const h = Math.floor(s / 3600);
  const m = Math.round((s % 3600) / 60);
  return h ? `${h} h ${String(m).padStart(2, '0')}` : `${m} min`;
}

/* ---------- Durée de la dernière séance du même jour de la semaine.
     Sert de repère : « 58 min — la semaine dernière 1 h 04 ». ---------- */
function lastSessionDur(sessions, beforeKey) {
  const dow = dowOfKey(beforeKey);
  let out = null;
  Object.keys(sessions || {})
    .filter((d) => d < beforeKey && dowOfKey(d) === dow)
    .sort()
    .forEach((d) => {
      const s = sessions[d];
      if (s && s.start && s.end && s.end > s.start) out = { date: d, sec: (s.end - s.start) / 1000 };
    });
  return out;
}

/* ---------- Bilan d'un exercice : volume (charge × reps) du jour face au
     même jour de la semaine précédent. Sans charge saisie (poids de corps),
     on compare le nombre de répétitions. ---------- */
function perfTotals(sets) {
  let vol = 0, reps = 0, best = null;
  (sets || []).forEach((raw) => {
    const n = normPerf(raw);
    if (n.r != null) reps += n.r;
    if (n.w != null && n.r != null) {
      vol += n.w * n.r;
      if (!best || n.w > best.w || (n.w === best.w && n.r > best.r)) best = n;
    }
  });
  return { vol, reps, best };
}

/* ---------- Moteur de records ----------
   Epley : 1RM = charge × (1 + reps / 30). Exact à 1 rep, fiable jusqu'à ~10.
   Au-delà, l'estimation dérive : on prévient l'utilisateur au lieu de mentir. */
const epley = (w, r) => (r <= 1 ? w : w * (1 + r / 30));
const estimate1RM = (w, r) => round2_5(epley(w, r));
const EPLEY_LIMIT = 10;

// Progressions conseillées en fin de mésocycle (bas du corps > haut du corps)
const CYCLE_BUMP = { squat: 5, deadlift: 5, bench: 2.5, ohp: 2.5 };

// Répartition des disques par côté (barre olympique 20 kg)
function plateBreakdown(total, bar = 20) {
  let side = (total - bar) / 2;
  if (side < 0) return null;
  const AVAIL = [25, 20, 15, 10, 5, 2.5, 1.25];
  const out = [];
  for (const p of AVAIL) {
    while (side >= p - 0.001) { out.push(p); side = Math.round((side - p) * 1000) / 1000; }
  }
  return { list: out, rest: side };
}

// Échauffement progressif avant les séries de travail
function warmupSets(top1rm, firstWorkPct) {
  if (!top1rm) return [];
  const steps = [
    { pct: 0,    reps: 8, label: 'Barre à vide' },
    { pct: 40,   reps: 5 },
    { pct: 55,   reps: 3 },
    { pct: Math.max(60, firstWorkPct - 12), reps: 2 },
  ];
  return steps.map((s) => ({
    reps: s.reps,
    label: s.label,
    weight: s.pct === 0 ? 20 : round2_5((top1rm * s.pct) / 100),
    pct: s.pct,
  }));
}

/* ============================================================
   3. AUDIO — "YEAH BUDDY!" (Web Audio API + Speech Synthesis)
   ============================================================ */

const AudioFX = {
  ctx: null,
  ready: false,

  init() {
    try {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        this.ctx = new AC();
      }
      if (this.ctx.state === 'suspended') this.ctx.resume();
      this.ready = true;
    } catch (e) { /* audio indisponible */ }
    return this.ctx;
  },

  // Débloque l'audio + la voix sur iOS/Safari (nécessite un geste utilisateur)
  unlock() {
    const ctx = this.init();
    if (ctx) {
      const o = ctx.createOscillator(); const g = ctx.createGain();
      g.gain.value = 0.0001; o.connect(g); g.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + 0.02);
    }
    if ('speechSynthesis' in window) {
      try {
        const u = new SpeechSynthesisUtterance(' ');
        u.volume = 0; window.speechSynthesis.speak(u);
      } catch (e) {}
    }
  },

  // Corne de brume de salle : saw détunées + sweep de filtre
  airhorn(when = 0, dur = 0.55, base = 155) {
    const ctx = this.init(); if (!ctx) return;
    const t = ctx.currentTime + when;
    const master = ctx.createGain();
    master.gain.setValueAtTime(0.0001, t);
    master.gain.exponentialRampToValueAtTime(0.55, t + 0.03);
    master.gain.setValueAtTime(0.55, t + dur - 0.12);
    master.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(700, t);
    filter.frequency.exponentialRampToValueAtTime(4200, t + 0.12);
    filter.Q.value = 6;

    [0, 7, -6, 12].forEach((detune, i) => {
      const o = ctx.createOscillator();
      o.type = i % 2 ? 'sawtooth' : 'square';
      o.frequency.setValueAtTime(base * (i === 3 ? 1.5 : 1), t);
      o.detune.value = detune * 4;
      const g = ctx.createGain();
      g.gain.value = i === 3 ? 0.18 : 0.32;
      o.connect(g); g.connect(filter);
      o.start(t); o.stop(t + dur + 0.05);
    });

    filter.connect(master);
    master.connect(ctx.destination);
  },

  // Impact grave qui claque
  boom(when = 0) {
    const ctx = this.init(); if (!ctx) return;
    const t = ctx.currentTime + when;
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(160, t);
    o.frequency.exponentialRampToValueAtTime(38, t + 0.35);
    g.gain.setValueAtTime(0.7, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.42);
    o.connect(g); g.connect(ctx.destination);
    o.start(t); o.stop(t + 0.45);
  },

  // Bips de compte à rebours (3 dernières secondes)
  tick(high = false) {
    const ctx = this.init(); if (!ctx) return;
    const t = ctx.currentTime;
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.type = 'triangle';
    o.frequency.value = high ? 1320 : 880;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.22, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
    o.connect(g); g.connect(ctx.destination);
    o.start(t); o.stop(t + 0.16);
  },

  speak(text) {
    if (!('speechSynthesis' in window)) return;
    try {
      const synth = window.speechSynthesis;
      const u = new SpeechSynthesisUtterance(text);
      const voices = synth.getVoices() || [];
      const v = voices.find((x) => /en[-_]US/i.test(x.lang) && /male|daniel|alex|fred|google us/i.test(x.name))
             || voices.find((x) => /en[-_]US/i.test(x.lang))
             || voices.find((x) => /^en/i.test(x.lang));
      if (v) u.voice = v;
      u.lang = 'en-US';
      u.rate = 0.82;
      u.pitch = 0.25;   // grave, façon Ronnie
      u.volume = 1;
      synth.cancel();
      synth.speak(u);
    } catch (e) {}
  },

  // Arpège ascendant triomphal (nouveau record)
  fanfare(when = 0) {
    const ctx = this.init(); if (!ctx) return;
    const t0 = ctx.currentTime + when;
    const notes = [523.25, 659.25, 783.99, 1046.5]; // Do-Mi-Sol-Do
    notes.forEach((f, i) => {
      const t = t0 + i * 0.11;
      const o = ctx.createOscillator(); const g = ctx.createGain();
      o.type = 'square';
      o.frequency.setValueAtTime(f, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.3, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + (i === 3 ? 0.7 : 0.22));
      o.connect(g); g.connect(ctx.destination);
      o.start(t); o.stop(t + 0.75);
    });
  },

  // Échantillon : import utilisateur en priorité, sinon l'extrait embarqué
  el: null,
  sampleSrc() {
    const s = CustomSound.get();
    if (s && s.data) return s.data;
    return window.EMBEDDED_SOUND || null;
  },
  playCustom() {
    const src = this.sampleSrc();
    if (!src) return false;
    try {
      if (!this.el) this.el = new Audio();
      this.el.src = src;
      this.el.currentTime = 0;
      this.el.volume = 1;
      const p = this.el.play();
      if (p && p.catch) p.catch(() => {});
      return true;
    } catch (e) { return false; }
  },

  // 🥇 L'Easter-egg complet — fin de temps de repos
  yeahBuddy() {
    if (this.playCustom()) return;      // son perso prioritaire
    this.boom(0);
    this.airhorn(0.02, 0.42, 150);
    this.airhorn(0.50, 0.42, 178);
    this.airhorn(0.98, 0.75, 205);
    setTimeout(() => this.speak('YEAH BUDDY! LIGHT WEIGHT BABY!'), 1500);
  },

  // 🏆 Nouveau record personnel
  prFanfare() {
    this.boom(0);
    this.fanfare(0.05);
    if (this.playCustom()) return;   // l'échantillon porte la suite, pas de superposition
    this.airhorn(0.55, 0.7, 196);
    setTimeout(() => this.speak('NEW PERSONAL RECORD! LIGHT WEIGHT BABY!'), 1250);
  },
};

/* ============================================================
   3 bis. ALARME DE FIN DE REPOS — ARRIÈRE-PLAN
   ------------------------------------------------------------
   Écran verrouillé ou appli en fond, les navigateurs gèlent les
   minuteurs JS : la sonnerie arriverait en retard, voire jamais.
   On confie donc l'alerte au lecteur audio du système. Au départ du
   repos (donc pendant le geste de l'utilisateur, seul moment où iOS
   autorise la lecture) on fabrique un WAV = durée du repos en quasi
   silence + motif d'alarme, et on le lance. Le son part à l'heure
   même si plus aucune ligne de JS ne tourne.

   Musique : le type de session audio « transient » demande au système
   de MÉLANGER notre son aux autres applis au lieu de les couper —
   Spotify continue, simplement atténué. Sans cette API (iOS < 16.4),
   le navigateur garde son comportement habituel.
   ============================================================ */

const BgAlarm = {
  el: null,
  url: null,
  alarmAt: 0,
  armed: false,
  RATE: 8000,
  ALARM_LEN: 2.4,
  LEAD: 0.35,   // l'alarme système part juste après le JS : en avant-plan
                // on l'annule à temps et le « YEAH BUDDY » joue seul.

  available() {
    return typeof Blob !== 'undefined' && typeof URL !== 'undefined' && !!URL.createObjectURL;
  },

  session(type) {
    try { if (navigator.audioSession) navigator.audioSession.type = type; } catch (e) {}
  },

  // WAV 8 bits / 8 kHz : ~8 Ko par seconde de repos, lisible partout.
  buildWav(silenceSec) {
    const rate = this.RATE;
    const n = Math.ceil((silenceSec + this.ALARM_LEN) * rate);
    const buf = new ArrayBuffer(44 + n);
    const dv = new DataView(buf);
    const wr = (off, str) => { for (let i = 0; i < str.length; i++) dv.setUint8(off + i, str.charCodeAt(i)); };
    wr(0, 'RIFF');  dv.setUint32(4, 36 + n, true);
    wr(8, 'WAVEfmt ');
    dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
    dv.setUint32(24, rate, true); dv.setUint32(28, rate, true);
    dv.setUint16(32, 1, true); dv.setUint16(34, 8, true);
    wr(36, 'data'); dv.setUint32(40, n, true);

    const pcm = new Uint8Array(buf, 44, n);
    pcm.fill(128);
    const start = Math.floor(silenceSec * rate);
    // Souffle inaudible : un flux de silence numérique pur peut être
    // interrompu par le système, qui le prend pour une piste morte.
    for (let i = 0; i < start; i += 977) pcm[i] = 129;

    // 3 bips courts puis une tenue : reconnaissable même poche fermée.
    [[0, 0.16, 988], [0.24, 0.16, 988], [0.48, 0.16, 1318], [0.8, 1.3, 880]].forEach((b) => {
      const s0 = start + Math.floor(b[0] * rate);
      const s1 = Math.min(n, s0 + Math.floor(b[1] * rate));
      for (let i = s0; i < s1; i++) {
        const t = (i - s0) / rate;
        const env = Math.min(1, t / 0.012, (s1 - i) / rate / 0.04);
        pcm[i] = 128 + Math.round(112 * env * Math.sin(2 * Math.PI * b[2] * t));
      }
    });
    return new Blob([buf], { type: 'audio/wav' });
  },

  arm(seconds) {
    this.disarm();
    if (!(seconds > 0) || !this.available()) return false;
    try {
      this.url = URL.createObjectURL(this.buildWav(seconds + this.LEAD));
      if (!this.el) {
        this.el = new Audio();
        this.el.preload = 'auto';
        this.el.setAttribute('playsinline', '');
        this.el.setAttribute('webkit-playsinline', '');
      }
      this.session('transient');
      this.el.loop = false;
      this.el.volume = 1;
      this.el.src = this.url;
      this.alarmAt = seconds + this.LEAD;
      this.armed = true;
      const p = this.el.play();
      if (p && p.catch) p.catch(() => { this.armed = false; });
      return true;
    } catch (e) { this.armed = false; return false; }
  },

  // Le motif d'alarme a-t-il déjà retenti ? (retour d'arrière-plan)
  fired() {
    try { return this.armed && !!this.el && this.el.currentTime >= this.alarmAt + 0.05; }
    catch (e) { return false; }
  },

  disarm() {
    this.armed = false;
    this.alarmAt = 0;
    try {
      if (this.el) { this.el.pause(); this.el.removeAttribute('src'); this.el.load(); }
    } catch (e) {}
    if (this.url) {
      try { URL.revokeObjectURL(this.url); } catch (e) {}
      this.url = null;
    }
  },
};

};

/* ---------- Séries de force : un exercice peut en demander moins que le cycle.
     On conserve alors les plus LOURDES (fin de la montée en charge). ---------- */
function forcePcts(ex, cyc) {
  const n = ex && ex.forceSets;
  return n && n < cyc.pct.length ? cyc.pct.slice(cyc.pct.length - n) : cyc.pct;
}

/* ---------- Repos effectif : surcharge utilisateur > `rest` de l'exercice > défaut ---------- */
function restFor(ex, overrides, forceDefault) {
  const o = overrides && overrides[ex.name];
  if (o != null) return o;
  return forceDefault != null ? forceDefault : restOf(ex);
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return { ...DEFAULT_STATE };
    const parsed = JSON.parse(raw);
    return {
      ...DEFAULT_STATE,
      ...parsed,
      profile: { ...DEFAULT_STATE.profile, ...(parsed.profile || {}) },
      settings: { ...DEFAULT_STATE.settings, ...(parsed.settings || {}) },
      logs: parsed.logs || {},
      prs: Array.isArray(parsed.prs) ? parsed.prs : [],
      restOverrides: parsed.restOverrides || {},
      dayPlans: parsed.dayPlans || {},
      perfLog: parsed.perfLog || {},
      sessions: parsed.sessions || {},
      nutrition: { ...DEFAULT_STATE.nutrition, ...(parsed.nutrition || {}) },
    };
  } catch (e) {
    return { ...DEFAULT_STATE };
  }
}

function saveState(s) {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch (e) {}
}

/* ============================================================
   6. CHRONOMÈTRE DE REPOS
   ============================================================ */

/* Replanifie l'alarme système sur le temps restant (±30 s, reprise…).
   Toujours appelé depuis un clic : iOS n'autorise la lecture que là. */
function rearmAlarm(settings, seconds) {
  if (settings && settings.sound && settings.bgAlarm !== false) BgAlarm.arm(seconds);
  else BgAlarm.disarm();
}

function RestTimer({ timer, setTimer, settings }) {
  const [now, setNow] = useState(Date.now());
  const firedRef = useRef(false);
  const lastTickRef = useRef(null);

  const timerId = timer ? timer.id : null;

  useEffect(() => {
    firedRef.current = false;
    lastTickRef.current = null;
    if (!timerId) { BgAlarm.disarm(); return; }
    const id = setInterval(() => setNow(Date.now()), 200);
    return () => clearInterval(id);
  }, [timerId]);

  // En arrière-plan les navigateurs bridant setInterval, l'affichage se fige et
  // l'alerte de fin peut arriver en retard. Dès que l'écran revient, on recalcule
  // immédiatement à partir de l'horodatage : le décompte se recale d'un coup.
  useEffect(() => {
    const onVis = () => { if (document.visibilityState === 'visible') setNow(Date.now()); };
    document.addEventListener('visibilitychange', onVis);
    return () => document.removeEventListener('visibilitychange', onVis);
  }, []);

  const remaining = !timer
    ? 0
    : timer.paused
      ? timer.remaining
      : Math.max(0, (timer.endsAt - now) / 1000);

  // Alertes : jamais pendant le rendu, toujours après commit
  useEffect(() => {
    if (!timer || timer.paused) return;

    // Bips des 3 dernières secondes
    if (remaining > 0 && remaining <= 3.2) {
      const s = Math.ceil(remaining);
      if (lastTickRef.current !== s) {
        lastTickRef.current = s;
        if (settings.sound) AudioFX.tick(false);
      }
    }

    // Fin du repos → vibration + YEAH BUDDY
    if (remaining <= 0 && !firedRef.current) {
      firedRef.current = true;
      if (settings.vibration) vibrate([200, 100, 200, 100, 500]);
      // Si le JS était gelé (écran verrouillé, autre appli), l'alarme système
      // a déjà sonné : inutile de la doubler au retour dans l'appli.
      const rang = BgAlarm.fired();
      BgAlarm.disarm();
      if (settings.sound && !rang) AudioFX.yeahBuddy();
    }
  });

  if (!timer) return null;

  const done = remaining <= 0;
  const a = ACC[done ? 'lime' : timer.accent || 'cyan'];
  const pct = clamp(remaining / timer.total, 0, 1);
  const R = 34, C = 2 * Math.PI * R;

  return (
    <div
      className="slide-up fixed inset-x-0 z-40 px-3"
      style={{ bottom: `calc(76px + var(--safe-b))` }}
    >
      <div className={`glass-strong mx-auto flex max-w-3xl items-center gap-3 rounded-3xl p-3 ${done ? 'alarm' : a.ring}`}>
        {/* Anneau de progression */}
        <div className="relative h-[76px] w-[76px] shrink-0">
          <svg viewBox="0 0 80 80" className="ring h-full w-full">
            <circle cx="40" cy="40" r={R} fill="none" stroke="rgba(255,255,255,.12)" strokeWidth="7" />
            <circle
              cx="40" cy="40" r={R} fill="none" stroke={a.hex} strokeWidth="7" strokeLinecap="round"
              strokeDasharray={C} strokeDashoffset={C * (1 - pct)}
              style={{ transition: 'stroke-dashoffset .25s linear', filter: `drop-shadow(0 0 6px ${a.hex})` }}
            />
          </svg>
          <div className="absolute inset-0 flex items-center justify-center">
            <span className={`font-display text-lg ${a.text}`}>
              {done ? 'GO' : mmss(remaining)}
            </span>
          </div>
        </div>

        {/* Infos */}
        <div className="min-w-0 flex-1">
          <p className={`font-display text-[13px] uppercase leading-tight ${done ? 'text-lime2 text-glow-lime' : 'text-white'}`}>
            {done ? 'YEAH BUDDY !' : 'Repos en cours'}
          </p>
          <p className="truncate text-[11px] font-semibold text-white/50">{timer.label}</p>
          {!done && (
            <div className="mt-2 flex gap-1.5">
              <button
                onClick={() => setTimer((t) => {
                  if (!t) return t;
                  const next = { ...t, endsAt: t.endsAt + 30000 };
                  if (!next.paused) rearmAlarm(settings, (next.endsAt - Date.now()) / 1000);
                  return next;
                })}
                className="press rounded-lg border border-white/15 bg-white/[.06] px-2 py-1 text-[10px] font-black text-white/75"
              >+30s</button>
              <button
                onClick={() =>
                  setTimer((t) => {
                    if (!t) return t;
                    if (t.paused) {
                      rearmAlarm(settings, t.remaining);
                      return { ...t, paused: false, endsAt: Date.now() + t.remaining * 1000 };
                    }
                    BgAlarm.disarm();
                    return { ...t, paused: true, remaining: Math.max(0, (t.endsAt - Date.now()) / 1000) };
                  })
                }
                className="press rounded-lg border border-white/15 bg-white/[.06] px-2 py-1 text-[10px] font-black text-white/75"
              >{timer.paused ? '▶ Reprendre' : '⏸ Pause'}</button>
            </div>
          )}
        </div>

        {/* Fermer */}
        <button
          onClick={() => { vibrate(0); BgAlarm.disarm(); setTimer(null); }}
          className={`press shrink-0 whitespace-pre-line rounded-2xl px-4 py-4 text-center font-display text-xs uppercase leading-tight ${done ? 'grad-lime text-ink' : 'border border-white/15 bg-white/[.06] text-white/70'}`}
          style={done ? { boxShadow: '0 8px 26px -8px #39FF14' } : undefined}
        >
          {done ? 'SÉRIE\nSUIVANTE' : 'Stop'}
        </button>
      </div>
    </div>
  );
}

/* ---------- Série d'hypertrophie : charge machine + reps réellement faites.
     Les inputs sont hors du bouton de validation (un input dans un <button>
     serait invalide et chaque frappe cocherait la série). ---------- */
function AccessorySetRow({ index, targetReps, checked, accent, perf, last, onToggle, onPerf }) {
  const a = ACC[accent];
  const cur = normPerf(perf);
  // Rien de saisi ? On pré-remplit avec la dernière fois — et c'est cette
  // valeur-là qui sera enregistrée si tu valides sans rien toucher.
  const carriedW = cur.w == null && last && last.w != null;
  const carriedR = cur.r == null && last && last.r != null;
  const effW = cur.w != null ? cur.w : carriedW ? last.w : null;
  const effR = cur.r != null ? cur.r : carriedR ? last.r : null;
  // Pendant la saisie on n'affiche que ce que TU as tapé (sinon effacer le
  // champ ferait réapparaître la valeur reprise et rendrait la frappe
  // impossible) ; la valeur de la dernière fois reste en repère grisé.
  const [editW, setEditW] = useState(false);
  const [editR, setEditR] = useState(false);
  const w = editW ? (cur.w != null ? cur.w : '') : effW != null ? effW : '';
  const r = editR ? (cur.r != null ? cur.r : '') : effR != null ? effR : '';
  const phW = last && last.w != null ? String(last.w) : '—';
  const phR = last && last.r != null ? String(last.r) : '—';
  const beat = last && last.w != null && last.r != null && effW != null && effR != null &&
    (effW > last.w || (effW === last.w && effR > last.r));

  return (
    <div
      className={`rounded-2xl border p-2.5 transition-colors ${
        checked ? 'border-lime2/45 bg-lime2/[.09]' : 'border-white/10 bg-white/[.035]'
      }`}
    >
      <div className="flex items-center gap-2">
        <button
          onClick={onToggle}
          className={`flex h-12 w-12 shrink-0 items-center justify-center rounded-xl border-2 font-display text-base transition-all press ${
            checked ? 'border-lime2 grad-lime text-ink pop' : 'border-white/20 bg-white/[.04] text-white/40'
          }`}
          style={checked ? { boxShadow: '0 0 22px -4px #39FF14' } : undefined}
        >
          {checked ? '✓' : index + 1}
        </button>

        <div className="relative flex-1">
          <input
            type="number" inputMode="decimal" step="0.5" value={w}
            onChange={(e) => onPerf('w', e.target.value === '' ? null : Math.max(0, parseFloat(e.target.value) || 0))}
            onFocus={() => setEditW(true)}
            onBlur={() => setEditW(false)}
            placeholder={phW}
            className={`w-full rounded-xl border border-white/12 bg-white/[.05] py-2.5 pl-3 pr-8 text-center font-display text-lg outline-none focus:border-white/40 ${carriedW ? 'text-white/45' : a.text}`}
          />
          <span className="pointer-events-none absolute right-2 top-1/2 -translate-y-1/2 text-[9px] font-black text-white/30">KG</span>
        </div>

        <span className="shrink-0 text-white/25">×</span>

        <div className="relative w-[84px] shrink-0">
          <input
            type="number" inputMode="numeric" value={r}
            onChange={(e) => onPerf('r', e.target.value === '' ? null : Math.max(0, parseInt(e.target.value) || 0))}
            onFocus={() => setEditR(true)}
            onBlur={() => setEditR(false)}
            placeholder={phR}
            className={`w-full rounded-xl border border-white/12 bg-white/[.05] py-2.5 pl-2 pr-9 text-center font-display text-lg outline-none focus:border-white/40 ${carriedR ? 'text-white/45' : 'text-white/90'}`}
          />
          <span className="pointer-events-none absolute right-2 top-1/2 -translate-y-1/2 text-[9px] font-black text-white/30">REPS</span>
        </div>
      </div>

      <div className="mt-1.5 flex items-center justify-between gap-2 px-1">
        <span className="text-[9px] font-black uppercase tracking-wider text-white/30">
          Objectif {targetReps} reps
        </span>
        {last ? (
          <span className={`text-[9px] font-black uppercase tracking-wider ${beat ? 'text-lime2' : 'text-white/35'}`}>
            {beat ? '▲ mieux que ' : 'dernière : '}{fmtPerf(last)}
          </span>
        ) : (
          <span className="text-[9px] font-black uppercase tracking-wider text-white/20">1re fois</span>
        )}
      </div>
    </div>
  );
}

          <input
            type="number" inputMode="decimal" step="2.5" value={weight || ''}

        <div className="mb-4 flex flex-wrap gap-1.5">

              onClick={() => setReps(n)}

                r === n ? `${a.grad} border-transparent text-ink` : 'border-white/12 bg-white/[.04] text-white/50'
              }`}
            >{n}</button>
          ))}
        </div>

        {/* Estimation */}
        <div
          className={`rounded-2xl border p-4 text-center transition-colors ${
            isPR ? 'border-lime2/45 bg-lime2/[.09]' : 'border-white/12 bg-white/[.03]'
          }`}
        >
          <p className="text-[10px] font-black uppercase tracking-wider text-white/45">
            {single ? '1RM réel' : '1RM estimé (indicatif)'}
          </p>
          <p className={`font-display text-4xl leading-tight ${isPR ? 'text-lime2 text-glow-lime' : 'text-white/70'}`}>
            {est ? fmtKg(est) : '—'} <span className="text-base text-white/40">KG</span>

function ExerciseCard({ ex, exIdx, ssPartner, state, dayKey, toggleSet, startTimer, openPR, setRestOverride, setPerf, lastPerf, delay }) {
  const [openWarmup, setOpenWarmup] = useState(false);
  const [editRest, setEditRest] = useState(false);
  const week = state.week;
  const cyc = CYCLE[week];
  const isForce = ex.kind === 'force';
  const lift = isForce ? LIFTS.find((l) => l.id === ex.lift) : null;
  const oneRM = isForce ? Number(state.profile[ex.lift] || 0) : 0;
  const accent = isForce ? lift.accent : (ex.kind === 'isolation' ? 'cyan' : ex.kind === 'sprint' ? 'lime' : 'viol');
  const a = ACC[accent];

  // Construction des séries
  const pcts = isForce ? forcePcts(ex, cyc) : null;

  const sets = useMemo(() => {
    if (isForce) {
      if (!oneRM) return [];
      return pcts.map((p) => ({ weight: round2_5((oneRM * p) / 100), reps: cyc.reps, pct: p }));
    }
    const n = ex.sets || 3;
    return Array.from({ length: n }, () => ({ weight: null, reps: ex.reps, pct: null }));
  }, [isForce, oneRM, week, ex]);

  // Superset : le 1er exercice s'enchaîne sans repos, le repos vient après la paire.
  // Le partenaire est déterminé à l'affichage, donc résistant à toute réorganisation.
  const isSSFirst = !!ssPartner;
  const defaultRest = isForce ? cyc.rest : restOf(ex);
  const restSec = isSSFirst ? 0 : restFor(ex, state.restOverrides, defaultRest);
  const isCustomRest = !isSSFirst && restSec !== defaultRest;
  // Clé par NOM d'exercice : les cases cochées suivent l'exercice même si
  // tu réorganises la séance (un index numérique se décalerait).
  const logs = state.logs[dayKey] || {};
  const doneCount = sets.filter((_, i) => logs[`${ex.name}|${i}`]).length;
  const perfToday = (state.perfLog && state.perfLog[dayKey] && state.perfLog[dayKey][ex.name]) || [];
  const complete = sets.length > 0 && doneCount === sets.length;

  const restLabel = fmtRest(restSec);
  const warm = isForce && oneRM ? warmupSets(oneRM, pcts[0]) : [];

  const kindLabel = { force: 'FORCE', compound: 'POLYARTICULAIRE', isolation: 'ISOLATION', sprint: 'SPRINT', finisher: 'FINISHER', cardio: 'ÉCHAUFFEMENT' }[ex.kind];

  return (
    <Card accent={accent} glow={isForce} className="rise overflow-hidden" style={{ animationDelay: `${delay}ms` }}>
      {/* En-tête */}
      <div className="relative p-4">
        <div className={`absolute inset-x-0 top-0 h-[3px] ${a.grad}`} />

        <div className="flex items-start justify-between gap-3">
          <div className="min-w-0">
            <div className="mb-1.5 flex flex-wrap items-center gap-1.5">
              <Pill accent={accent}>{kindLabel}</Pill>
              {ex.ss && <Pill accent="lime">🔗 SUPERSET {ex.ss}</Pill>}
              {isForce && <Pill accent={cyc.accent}>S{week} · {cyc.name}</Pill>}
              {complete && <Pill accent="lime">✓ TERMINÉ</Pill>}
            </div>
            <h3 className={`font-display text-lg leading-tight ${complete ? 'text-white/45 strike' : 'text-white'}`}>
              {ex.name}
            </h3>
          </div>

          {sets.length > 0 && (
            <div className="shrink-0 text-right">
              <div className={`font-display text-2xl leading-none ${a.text}`}>{doneCount}<span className="text-white/25">/{sets.length}</span></div>
              <div className="mt-0.5 text-[9px] font-black uppercase tracking-wider text-white/35">Séries</div>
            </div>
          )}
        </div>

        {/* Bandeau infos */}
        <div className="mt-3 flex flex-wrap items-center gap-x-3 gap-y-1 text-[11px] font-bold text-white/50">
          {isForce && oneRM > 0 && <span>1RM <b className={a.text}>{fmtKg(oneRM)} kg</b></span>}
          {isForce && <span className="text-white/20">|</span>}
          {isSSFirst && (
            <span className="rounded-lg border border-lime2/35 bg-lime2/[.08] px-2 py-1 text-[11px] font-bold text-lime2">
              ⤵ Enchaîne sans repos avec <b>{ssPartner}</b>
            </span>
          )}
          {restSec > 0 && (
            <button
              onClick={() => setEditRest((v) => !v)}
              className={`press rounded-lg border px-2 py-1 text-[11px] font-bold transition-colors ${
                isCustomRest ? 'border-lime2/40 bg-lime2/[.08] text-lime2' : 'border-white/12 bg-white/[.04] text-white/55'
              }`}
            >
              ⏱ Repos <b className={isCustomRest ? 'text-lime2' : 'text-white/85'}>{restLabel}</b>
              <span className="ml-1 text-white/30">✎</span>
            </button>
          )}
          {isForce && (
            <>
              <span className="text-white/20">|</span>
              <span className="text-white/40">{pcts.length}×{cyc.reps} @ {cyc.tag.split(' @ ')[1]}</span>
            </>
          )}
        </div>

        {/* Réglage du temps de repos — mémorisé pour les séances suivantes */}
        {editRest && restSec > 0 && (
          <div className="mt-2 rounded-2xl border border-white/12 bg-white/[.04] p-3">
            <p className="mb-2 text-[10px] font-black uppercase tracking-wider text-white/45">
              Temps de repos — {ex.name}
            </p>
            <div className="flex flex-wrap gap-1.5">
              {[30, 45, 60, 90, 120, 180, 240, 300].map((s) => (
                <button
                  key={s}
                  onClick={() => setRestOverride(ex.name, s)}
                  className={`press flex-1 rounded-lg border px-2 py-2 font-display text-[11px] transition-all ${
                    restSec === s ? `${a.grad} border-transparent text-ink` : 'border-white/12 bg-white/[.04] text-white/55'
                  }`}
                  style={{ minWidth: '58px' }}
                >
                  {fmtRest(s)}
                </button>
              ))}
            </div>
            <div className="mt-2 flex gap-1.5">
              <button
                onClick={() => setRestOverride(ex.name, Math.max(15, restSec - 15))}
                className="press flex-1 rounded-lg border border-white/12 bg-white/[.04] py-2 text-[11px] font-black text-white/60"
              >−15s</button>
              <button
                onClick={() => setRestOverride(ex.name, Math.min(900, restSec + 15))}
                className="press flex-1 rounded-lg border border-white/12 bg-white/[.04] py-2 text-[11px] font-black text-white/60"
              >+15s</button>
              <button
                onClick={() => setRestOverride(ex.name, null)}
                disabled={!isCustomRest}
                className="press flex-1 rounded-lg border border-white/12 bg-white/[.04] py-2 text-[11px] font-black text-white/60 disabled:opacity-30"
              >↺ Défaut</button>
            </div>
            <p className="mt-2 text-[10px] font-semibold leading-relaxed text-white/35">
              {isCustomRest
                ? `Réglage personnalisé, conservé pour toutes tes prochaines séances (défaut : ${fmtRest(defaultRest)}).`
                : 'Ton choix est mémorisé et réappliqué automatiquement aux séances suivantes.'}
            </p>
          </div>
        )}

        {/* Objectif du jour, en clair */}
        {isForce && oneRM > 0 && (
          <div className="mt-3 rounded-2xl border border-white/12 bg-white/[.05] p-3">
            <p className="text-[9px] font-black uppercase tracking-wider text-white/40">Ce que tu dois faire</p>
            <p className="mt-0.5 font-display text-base leading-tight text-white">
              {sets.length} séries × {cyc.reps} rep{cyc.reps > 1 ? 's' : ''}
            </p>
            <p className={`mt-0.5 font-display text-lg leading-tight ${a.text}`}>
              {sets.map((s) => fmtKg(s.weight)).join(' · ')} <span className="text-xs text-white/40">KG</span>
            </p>
          </div>
        )}

        {!isForce && lastPerf && (
          <div className="mt-3 rounded-2xl border border-white/12 bg-white/[.04] p-2.5">
            <p className="text-[9px] font-black uppercase tracking-wider text-white/40">
              Dernier {new Date(lastPerf.date + 'T12:00:00').toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'short' })} — à battre
            </p>
            <p className="mt-0.5 text-[12px] font-extrabold text-white/75">
              {lastPerf.sets.map((s) => fmtPerf(s)).join('  ·  ')}
            </p>
          </div>
        )}

        {isForce && <p className="mt-2 text-[11px] font-semibold italic text-white/40">{cyc.rpe}</p>}
        {ex.note && <p className="mt-2 rounded-xl border border-white/[.07] bg-white/[.03] p-2.5 text-[11px] font-medium leading-relaxed text-white/55">💡 {ex.note}</p>}
      </div>

      {/* 1RM manquant */}
      {isForce && !oneRM && (
        <div className="mx-4 mb-4 rounded-2xl border border-neon/40 bg-neon/10 p-4 text-center">
          <p className="font-display text-sm text-neon">1RM MANQUANT</p>
          <p className="mt-1 text-[11px] font-semibold text-white/60">
            Renseigne ton max de {lift.label} dans l'onglet Profil pour générer les charges.
          </p>
        </div>
      )}

      {/* Échauffement */}
      {warm.length > 0 && (
        <div className="mx-4 mb-3">
          <button
            onClick={() => setOpenWarmup((v) => !v)}
            className="press flex w-full items-center justify-between rounded-xl border border-white/10 bg-white/[.03] px-3 py-2.5"
          >
            <span className="text-[11px] font-black uppercase tracking-wider text-white/55">🔥 Montée en charge</span>
            <span className="text-[11px] font-black text-white/40">{openWarmup ? '−' : '+'}</span>
          </button>
          {openWarmup && (
            <div className="mt-2 grid grid-cols-2 gap-1.5">
              {warm.map((w, i) => (
                <div key={i} className="rounded-xl border border-white/[.08] bg-white/[.025] p-2.5">
                  <div className="font-display text-base text-white/80">{fmtKg(w.weight)} <span className="text-[10px] text-white/40">KG</span></div>
                  <div className="text-[10px] font-bold text-white/40">{w.label || `${w.pct}%`} · {w.reps} reps</div>
                </div>
              ))}
            </div>
          )}
        </div>
      )}

      {/* Séries */}
      {sets.length > 0 && (
        <div className="space-y-1.5 px-4 pb-4">
          {sets.map((s, i) => {
            const key = `${ex.name}|${i}`;
            const checked = !!logs[key];
            const toggle = () => {
              const nowChecked = !checked;
              toggleSet(dayKey, key, nowChecked);
              vibrate(nowChecked ? 35 : 0);
              const isLast = i === sets.length - 1;
              if (nowChecked && restSec > 0 && !isLast) {
                startTimer(restSec, `${ex.name} — série ${i + 1}/${sets.length}`, accent);
              }
            };

            if (!isForce) {
              const validLast = lastSetFor(lastPerf, i);
              return (
                <AccessorySetRow
                  key={key}
                  index={i}
                  targetReps={s.reps}
                  checked={checked}
                  accent={accent}
                  perf={perfToday[i]}
                  last={validLast}
                  onPerf={(field, value) => setPerf(dayKey, ex.name, i, field, value)}
                  onToggle={() => {
                    // Valider reprend la perf précédente pour tout champ laissé
                    // vide : la charge de la dernière fois est enregistrée telle
                    // quelle, champ par champ, jamais un trou dans l'historique.
                    const cur = normPerf(perfToday[i]);
                    if (!checked && validLast) {
                      if (cur.w == null && validLast.w != null) setPerf(dayKey, ex.name, i, 'w', validLast.w);
                      if (cur.r == null && validLast.r != null) setPerf(dayKey, ex.name, i, 'r', validLast.r);
                    }
                    toggle();
                  }}
                />
              );
            }

            return (
              <SetRow
                key={key}
                index={i}
                weight={s.weight}
                reps={s.reps}
                pct={s.pct}
                checked={checked}
                accent={accent}
                showPlates={isForce}
                onToggle={() => toggle()}
              />
            );
          })}
        </div>
      )}

      {/* Déclaration de record — met à jour le 1RM et tout le programme */}
      {isForce && (
        <div className="px-4 pb-4">
          <button
            onClick={() =>
              openPR(ex.lift, {
                weight: sets.length ? sets[sets.length - 1].weight : oneRM,
                reps: 1,
              })
            }
            className="press flex w-full items-center justify-center gap-2 rounded-2xl border border-lime2/35 bg-lime2/[.07] py-3.5 font-display text-[11px] uppercase tracking-wider text-lime2"
          >
            🏆 {oneRM ? 'J\'ai battu mon record' : 'Enregistrer mon max'}
          </button>
        </div>
      )}
    </Card>
  );
}

function SessionEditor({ dow, state, setDayPlan, onDone }) {
  const base = PROGRAM[dow].exercises.map((e) => e.name);
  const current = (state.dayPlans && state.dayPlans[dow]) || base;
  const [picker, setPicker] = useState(null); // { mode:'add'|'replace', index }

  const commit = (names) => setDayPlan(dow, names);

  const move = (i, dir) => {
    const next = current.slice();
    const j = i + dir;
    if (j < 0 || j >= next.length) return;
    const t = next[i]; next[i] = next[j]; next[j] = t;
    commit(next);
  };
  const remove = (i) => {
    const next = current.slice();
    next.splice(i, 1);
    commit(next);
  };
  const modified = JSON.stringify(current) !== JSON.stringify(base);

  return (
    <>
      <Card accent="cyan" glow className="rise p-4">
        <div className="mb-3 flex items-center justify-between gap-3">
          <div className="min-w-0">
            <p className="font-display text-sm uppercase text-white">✏️ Modifier la séance</p>
            <p className="text-[10px] font-semibold text-white/40">
              Réorganise, remplace ou retire. Enregistré automatiquement.
            </p>
          </div>
          <button onClick={onDone} className="press shrink-0 rounded-xl grad-cyan px-4 py-2.5 font-display text-[11px] uppercase text-ink">
            Terminé
          </button>
        </div>

        <div className="space-y-1.5">
          {current.map((name, i) => {
            const ex = CATALOG.get(name);
            if (!ex) return null;
            const isForce = ex.kind === 'force';
            return (
              <div key={name} className="flex items-center gap-2 rounded-2xl border border-white/10 bg-white/[.03] p-2.5">
                <div className="flex shrink-0 flex-col gap-1">
                  <button
                    onClick={() => move(i, -1)} disabled={i === 0}
                    className="press h-7 w-7 rounded-lg border border-white/12 bg-white/[.05] text-[11px] font-black text-white/60 disabled:opacity-25"
                  >▲</button>
                  <button
                    onClick={() => move(i, 1)} disabled={i === current.length - 1}
                    className="press h-7 w-7 rounded-lg border border-white/12 bg-white/[.05] text-[11px] font-black text-white/60 disabled:opacity-25"
                  >▼</button>
                </div>

                <div className="min-w-0 flex-1">
                  <p className={`truncate text-[12px] font-extrabold ${isForce ? 'text-neon' : 'text-white/85'}`}>
                    {ex.ss && <span className="mr-1 text-lime2">🔗</span>}{name}
                  </p>
                  <p className="text-[10px] font-bold text-white/35">
                    {isForce ? 'Mouvement principal' : `${ex.sets}×${ex.reps}`}
                  </p>
                </div>

                <button
                  onClick={() => setPicker({ mode: 'replace', index: i })}
                  className="press shrink-0 rounded-lg border border-white/12 bg-white/[.05] px-2.5 py-2 text-[11px] font-black text-white/60"
                >🔄</button>
                <button
                  onClick={() => remove(i)}
                  className="press shrink-0 rounded-lg border border-neon/35 bg-neon/[.08] px-2.5 py-2 text-[11px] font-black text-neon"
                >✕</button>
              </div>
            );
          })}
        </div>

        <div className="mt-3 flex gap-2">
          <GhostButton accent="cyan" className="flex-1" onClick={() => setPicker({ mode: 'add' })}>
            ＋ Ajouter un exercice
          </GhostButton>
          {modified && (
            <GhostButton accent="viol" onClick={() => setDayPlan(dow, null)}>
              ↺ Séance d'origine
            </GhostButton>
          )}
        </div>

        <p className="mt-2 text-[10px] font-semibold leading-relaxed text-white/30">
          Tu ne peux choisir que des exercices déjà présents dans le programme. Pour en créer de nouveaux,
          dis-le-moi et j'ajoute un formulaire de création.
        </p>
      </Card>

      {picker && (
        <ExercisePicker
          exclude={current}
          title={picker.mode === 'replace' ? `Remplacer « ${current[picker.index]} »` : 'Ajouter à la séance'}
          onClose={() => setPicker(null)}
          onPick={(name) => {
            const next = current.slice();
            if (picker.mode === 'replace') next[picker.index] = name;
            else next.push(name);
            commit(next);
            setPicker(null);
          }}
        />
      )}
    </>
  );
}

function TodayView({ state, setState, toggleSet, setSession, startTimer, openPR, setRestOverride, setDayPlan, setPerf, goProfile }) {
  const realDow = new Date().getDay();
  const [dow, setDow] = useState(realDow);
  const [editing, setEditing] = useState(false);
  const stripRef = useRef(null);
  const session = PROGRAM[dow];
  const exList = exercisesFor(dow, state);
  const isCustomPlan = !!(state.dayPlans && state.dayPlans[dow]);

  // Recentre le jour actif dans le carrousel (sinon DIM/SAM restent hors écran)
  useEffect(() => {
    const strip = stripRef.current;
    if (!strip) return;
    const btn = strip.querySelector('[data-active="1"]');
    if (btn && btn.scrollIntoView) {
      btn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    }
  }, [dow]);
  const isToday = dow === realDow;
  const sessionDate = isToday ? new Date() : dateOfWeekday(dow);
  const dKey = dateKey(sessionDate);
  const cyc = CYCLE[state.week];
  const lastPerfMap = useMemo(() => buildLastPerf(state.perfLog, dKey), [state.perfLog, dKey]);

  // Statistiques du jour
  const stats = useMemo(() => {
    if (session.off) return { total: 0, done: 0, tonnage: 0 };
    const logs = state.logs[dKey] || {};
    let total = 0, done = 0, tonnage = 0;
    exList.forEach((ex, exIdx) => {
      let sets = [];
      if (ex.kind === 'force') {
        const rm = Number(state.profile[ex.lift] || 0);
        sets = rm ? forcePcts(ex, cyc).map((p) => ({ w: round2_5((rm * p) / 100), r: cyc.reps })) : [];
      } else {
        // Le tonnage des accessoires vient des charges réellement saisies,
        // complétées par celles reprises de la dernière séance.
        const perf = (state.perfLog && state.perfLog[dKey] && state.perfLog[dKey][ex.name]) || [];
        sets = Array.from({ length: ex.sets || 3 }, (_, i) => {
          const cur = normPerf(perf[i]);
          const prev = lastSetFor(lastPerfMap[ex.name], i);
          return {
            w: (cur.w != null ? cur.w : prev && prev.w != null ? prev.w : 0),
            r: (cur.r != null ? cur.r : prev && prev.r != null ? prev.r : 0),
          };
        });
      }
      sets.forEach((s, i) => {
        total++;
        if (logs[`${ex.name}|${i}`]) { done++; tonnage += s.w * s.r; }
      });
    });
    return { total, done, tonnage };
  }, [state, dKey, session, cyc, exList, lastPerfMap]);

  const a = ACC[session.accent];
  const allDone = stats.total > 0 && stats.done === stats.total;

  /* ---------- Chrono de séance ---------- */
  const sess = (state.sessions && state.sessions[dKey]) || null;
  const running = !!(sess && sess.start && !sess.end);
  const [clockNow, setClockNow] = useState(Date.now());
  useEffect(() => {
    if (!running) return;
    setClockNow(Date.now());
    const id = setInterval(() => setClockNow(Date.now()), 1000);
    return () => clearInterval(id);
  }, [running, sess && sess.start]);

  const elapsed = sess && sess.start ? Math.max(0, ((sess.end || clockNow) - sess.start) / 1000) : 0;
  const prevDur = useMemo(() => lastSessionDur(state.sessions, dKey), [state.sessions, dKey]);

  // La dernière série cochée arrête le chrono ; décocher le relance.
  useEffect(() => {
    if (!sess || !sess.start) return;
    if (allDone && !sess.end) setSession(dKey, 'stop');
    else if (!allDone && sess.end) setSession(dKey, 'resume');
  }, [allDone, sess, dKey, setSession]);

  /* ---------- Bilan de fin de séance : progrès et reculs, exercice par
       exercice, face au même jour de la semaine précédent. ---------- */
  const bilan = useMemo(() => {
    if (session.off) return [];
    const today = (state.perfLog && state.perfLog[dKey]) || {};
    const rows = [];
    exList.forEach((ex) => {
      if (ex.kind === 'force') return;         // charges pilotées par le cycle
      const t = perfTotals(today[ex.name]);
      const prevRef = lastPerfMap[ex.name];
      const p = prevRef ? perfTotals(prevRef.sets) : null;
      const useVol = t.vol > 0 || (p && p.vol > 0);
      const tv = useVol ? t.vol : t.reps;
      const pv = p ? (useVol ? p.vol : p.reps) : null;
      if (!tv && !pv) return;                  // exercice jamais renseigné
      const delta = pv ? (tv - pv) / pv : null;
      rows.push({
        name: ex.name,
        unit: useVol ? 'kg' : 'reps',
        tv, pv, delta,
        best: t.best, prevBest: p ? p.best : null,
        dir: pv == null ? 'new' : delta > 0.01 ? 'up' : delta < -0.01 ? 'down' : 'same',
      });
    });
    const order = { up: 0, down: 1, same: 2, new: 3 };
    rows.sort((x, y) => order[x.dir] - order[y.dir] || y.tv - x.tv);
    return rows;
  }, [state.perfLog, dKey, exList, lastPerfMap, session]);

  const nUp = bilan.filter((r) => r.dir === 'up').length;

      {/* Bandeau du jour */}

function ProfileView({ state, setState, openPR, applyCycleBump }) {
  const fileRef = useRef(null);
  const soundRef = useRef(null);
  const [sound, setSound] = useState(() => CustomSound.get());
  const prs = state.prs || [];

  const setRM = (id, val) =>
    setState((s) => ({ ...s, profile: { ...s.profile, [id]: val } }));

  const total = LIFTS.slice(0, 3).reduce((acc, l) => acc + (Number(state.profile[l.id]) || 0), 0);

  const exportData = () => {
    // Le son perso vit dans une clé séparée : on le rapatrie pour une sauvegarde complète
    const payload = { ...state, customSound: CustomSound.get() };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `odp-${dateKey()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  };

  const importData = (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(String(reader.result));
        if (!parsed || typeof parsed !== 'object') throw new Error('bad');
        const { customSound, ...rest } = parsed;
        if (customSound && customSound.data) {
          CustomSound.set(customSound);
          setSound(customSound);
        }
        setState({
          ...DEFAULT_STATE,
          ...rest,
          profile: { ...DEFAULT_STATE.profile, ...(rest.profile || {}) },
          settings: { ...DEFAULT_STATE.settings, ...(rest.settings || {}) },
          logs: rest.logs || {},
          prs: Array.isArray(rest.prs) ? rest.prs : [],
        });
        alert('✅ Sauvegarde importée.');
      } catch (err) {
        alert('❌ Fichier invalide.');
      }
    };
    reader.readAsText(f);
    e.target.value = '';
  };

  const resetAll = () => {
    if (!confirm('Effacer TOUTES les données (1RM, historique, réglages) ? Cette action est irréversible.')) return;
    if (!confirm('Dernière confirmation : tout sera perdu définitivement.')) return;
    localStorage.removeItem(STORE_KEY);
    CustomSound.clear();
    setSound(null);
    setState({ ...DEFAULT_STATE, logs: {}, prs: [] });
  };

  const clearHistory = () => {
    if (!confirm('Effacer uniquement l\'historique des séances ? Tes 1RM seront conservés.')) return;
    setState((s) => ({ ...s, logs: {} }));
  };

  const sessions = Object.keys(state.logs)
    .filter((k) => !k.startsWith('preview-') && Object.values(state.logs[k]).some(Boolean))
    .sort().reverse();

  const Toggle = ({ label, desc, val, onChange }) => (
    <button
      onClick={() => onChange(!val)}
      className="press flex w-full items-center justify-between gap-3 rounded-2xl border border-white/10 bg-white/[.03] p-3.5 text-left"
    >
      <div className="min-w-0">
        <p className="text-[13px] font-extrabold text-white/85">{label}</p>
        <p className="text-[10px] font-semibold text-white/35">{desc}</p>
      </div>
      <div
        className={`relative h-7 w-12 shrink-0 rounded-full transition-all ${val ? 'grad-lime' : 'bg-white/12'}`}
        style={val ? { boxShadow: '0 0 16px -3px #39FF14' } : undefined}
      >
        <div className={`absolute top-1 h-5 w-5 rounded-full bg-white transition-all ${val ? 'left-6' : 'left-1'}`} />
      </div>
    </button>
  );

  return (
    <div className="space-y-4">
      <SectionTitle sub="Ces maxima pilotent tous les calculs de charge du programme.">
        Mes Maxima (1RM)
      </SectionTitle>

      {LIFTS.map((l, i) => {
        const a = ACC[l.accent];
        const val = Number(state.profile[l.id]) || 0;
        return (
          <Card key={l.id} accent={l.accent} glow={val > 0} className="rise p-4" style={{ animationDelay: `${i * 50}ms` }}>
            <div className="flex items-center gap-3">
              <span className="shrink-0 text-2xl">{l.icon}</span>
              <div className="min-w-0 flex-1">
                <p className={`font-display text-base leading-tight ${a.text}`}>{l.label}</p>
                <p className="text-[10px] font-black uppercase tracking-wider text-white/35">Max sur 1 répétition</p>
              </div>
              <span className="shrink-0 font-display text-[10px] uppercase tracking-wider text-white/25">{l.short}</span>
            </div>

            <div className="mt-3 flex items-center gap-2">
              <button
                onClick={() => setRM(l.id, Math.max(0, val - 2.5))}
                className="press h-12 w-12 shrink-0 rounded-xl border border-white/12 bg-white/[.05] font-display text-lg text-white/60"
              >−</button>
              <input
                type="number" inputMode="decimal" step="2.5" value={val || ''}
                onChange={(e) => setRM(l.id, Math.max(0, parseFloat(e.target.value) || 0))}
                placeholder="0"
                className={`w-full rounded-xl border border-white/12 bg-white/[.05] px-2 py-2.5 text-center font-display text-2xl outline-none focus:border-white/40 ${a.text}`}
              />
              <button
                onClick={() => setRM(l.id, val + 2.5)}
                className="press h-12 w-12 shrink-0 rounded-xl border border-white/12 bg-white/[.05] font-display text-lg text-white/60"
              >+</button>
            </div>

            {/* Aperçu des charges de la semaine */}
            {val > 0 && (
              <div className="mt-3 flex flex-wrap gap-1.5">
                {CYCLE[state.week].pct.map((p, k) => (
                  <span key={k} className="rounded-lg border border-white/10 bg-white/[.04] px-2 py-1 text-[10px] font-black text-white/60">
                    {fmtKg(round2_5((val * p) / 100))}kg <span className="text-white/30">·{p}%</span>
                  </span>
                ))}
              </div>
            )}

            {/* Progression cumulée + déclaration de record */}
            <div className="mt-3 flex items-center gap-2">
              <button
                onClick={() => openPR(l.id, { weight: val, reps: 1 })}
                className="press flex-1 rounded-xl border border-lime2/35 bg-lime2/[.07] py-2.5 font-display text-[10px] uppercase tracking-wider text-lime2"
              >
                🏆 Nouveau record
              </button>
              {(() => {
                const hist = prs.filter((p) => p.lift === l.id);
                if (!hist.length) return null;
                const start = hist[hist.length - 1].prev || 0;
                const gain = val - start;
                if (!start || gain <= 0) return null;
                return (
                  <span className="shrink-0 rounded-xl border border-white/10 bg-white/[.04] px-3 py-2.5 text-[10px] font-black text-lime2">
                    +{fmtKg(gain)} kg
                  </span>
                );
              })()}
            </div>
          </Card>
        );
      })}

      {/* Total SBD */}
      {total > 0 && (
        <Card accent="pink" glow className="rise p-4 text-center">
          <p className="text-[10px] font-black uppercase tracking-[.2em] text-white/40">Total Powerlifting (S+B+D)</p>
          <p className="font-display text-4xl leading-tight clip-text grad-pink">{fmtKg(total)}<span className="text-lg"> KG</span></p>
        </Card>
      )}

      {/* Semaine du cycle */}
      <SectionTitle sub="Change de semaine chaque lundi pour suivre la périodisation.">
        Semaine du Mésocycle
      </SectionTitle>
      <div className="grid grid-cols-2 gap-2">
        {[1, 2, 3, 4].map((w) => {
          const c = CYCLE[w];
          const a = ACC[c.accent];
          const active = state.week === w;
          return (
            <button
              key={w}
              onClick={() => setState((s) => ({ ...s, week: w }))}
              className={`press rounded-2xl border p-3.5 text-left transition-all ${active ? 'border-white/25 bg-white/[.09]' : 'border-white/[.08] bg-white/[.025]'}`}
              style={active ? { boxShadow: `0 0 0 1px ${a.hex}66, 0 0 26px -8px ${a.hex}` } : undefined}
            >
              <div className="flex items-center justify-between">
                <span className={`font-display text-xl ${active ? a.text : 'text-white/30'}`}>S{w}</span>
                {active && <span className="text-lime2">●</span>}
              </div>
              <p className={`mt-0.5 font-display text-[11px] uppercase leading-tight ${active ? 'text-white/85' : 'text-white/35'}`}>{c.name}</p>
              <p className={`mt-1 text-[10px] font-bold ${active ? a.text : 'text-white/25'}`}>{c.tag}</p>
            </button>
          );
        })}
      </div>

      <Card accent={CYCLE[state.week].accent} className="rise p-4">
        <p className="text-[11px] font-semibold italic leading-relaxed text-white/55">
          <b className={ACC[CYCLE[state.week].accent].text}>Semaine {state.week} — {CYCLE[state.week].name}.</b>{' '}
          {CYCLE[state.week].rpe} Repos entre séries lourdes : <b className="text-white/80">{Math.floor(CYCLE[state.week].rest / 60)} min</b>.
        </p>
        {state.week < 4 && (
          <div className="mt-3">
            <GhostButton accent="viol" className="w-full" onClick={() => setState((s) => ({ ...s, week: s.week + 1 }))}>
              Semaine suivante →
            </GhostButton>
          </div>
        )}
      </Card>

      {/* Fin de mésocycle : progression automatique des 1RM */}
      {state.week === 4 && (
        <Card accent="lime" glow className="rise p-4">
          <p className="font-display text-sm uppercase text-lime2">🔄 Fin du mésocycle {state.cycleNo}</p>
          <p className="mt-1 text-[11px] font-semibold leading-relaxed text-white/50">

          </p>
          <div className="mt-3 space-y-1.5">
            {LIFTS.map((l) => {
              const prev = Number(state.profile[l.id]) || 0;
              if (!prev) return null;
              const next = round2_5(prev + CYCLE_BUMP[l.id]);
              return (
                <div key={l.id} className="flex items-center gap-2 rounded-xl border border-white/[.08] bg-white/[.025] px-3 py-2">
                  <span className="flex-1 text-[11px] font-extrabold text-white/70">{l.label}</span>

            <BigButton
              accent="lime"

        </Card>
      )}

      {/* Historique des records */}
      {prs.length > 0 && (
        <>
          <SectionTitle sub="Chaque record met automatiquement ton 1RM et tes charges à jour.">

          </SectionTitle>
          <Card accent="lime" className="rise divide-y divide-white/[.07] p-1">
            {prs.slice(0, 20).map((p) => {
              const l = LIFTS.find((x) => x.id === p.lift);
              if (!l) return null;
              const acc = ACC[l.accent];
              const gain = p.e1rm - (p.prev || 0);
              const d = new Date(p.date + 'T12:00:00');

              return (
                <div key={p.id} className="flex items-center gap-3 px-3 py-2.5">
                  <span className="shrink-0 text-base">{icon}</span>
                  <div className="min-w-0 flex-1">
                    <p className={`truncate text-[12px] font-extrabold ${acc.text}`}>{l.label}</p>
                    <p className="text-[10px] font-bold text-white/35">
                      {p.kind === 'cycle'
                        ? `Progression de mésocycle`
                        : `${fmtKg(p.weight)} kg × ${p.reps} rep${p.reps > 1 ? 's' : ''}`}

                    </p>
                  </div>
                  <div className="shrink-0 text-right">
                    <p className="font-display text-base leading-none text-white/85">{fmtKg(p.e1rm)}<span className="text-[9px] text-white/30"> KG</span></p>
